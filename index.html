<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTX 9800 DSi — Field Reference</title>
<style>
:root{
  --bg:#10141a;
  --panel:#171d26;
  --panel2:#1e2733;
  --panel3:#242f3d;
  --border:#2b3644;
  --border2:#3a4759;
  --text:#e7ecf2;
  --text-dim:#93a1b2;
  --text-dim2:#6b7889;
  --power:#e8a33d;
  --power-dim:#5a4626;
  --data:#4fc7dd;
  --data-dim:#204852;
  --control:#7ed492;
  --control-dim:#254633;
  --safety:#ef6a63;
  --safety-dim:#4a2523;
  --xray:#c397ea;
  --xray-dim:#3a2c4a;
  --mechc:#c99a5b;
  --mechc-dim:#4a3c26;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:28px 28px;
  background-attachment:fixed;
  background-color:var(--bg);
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:radial-gradient(ellipse at top left, rgba(79,199,221,0.05), transparent 55%),
             radial-gradient(ellipse at bottom right, rgba(232,163,61,0.04), transparent 55%);
  pointer-events:none;
  z-index:0;
}

/* ---------- layout ---------- */
#app{display:flex; min-height:100vh; position:relative; z-index:1;}

#sidebar{
  width:238px; flex-shrink:0;
  background:linear-gradient(180deg, #141a22, #10141a 60%);
  border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column;
  overflow-y:auto;
}
.brand{
  padding:18px 18px 14px 18px;
  border-bottom:1px solid var(--border);
}
.brand-mark{
  display:flex; align-items:center; gap:9px;
}
.brand-chip{
  width:30px;height:30px;border-radius:7px;
  background:conic-gradient(from 220deg, var(--data), var(--power), var(--safety), var(--data));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono); font-weight:700; font-size:12px; color:#0c1015;
  flex-shrink:0;
}
.brand-title{font-weight:700; font-size:15px; letter-spacing:0.2px;}
.brand-sub{font-family:var(--mono); font-size:10.5px; color:var(--text-dim2); margin-top:3px;}

nav{padding:10px 10px 18px 10px; flex:1;}
.nav-group{margin-top:14px;}
.nav-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em;
  color:var(--text-dim2); padding:4px 10px 6px 10px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:8px;
  color:var(--text-dim); text-decoration:none; cursor:pointer;
  font-size:13px; margin-bottom:2px; border:1px solid transparent;
  user-select:none;
}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:var(--panel3); color:var(--text); border-color:var(--border2);}
.nav-dot{width:7px;height:7px;border-radius:50%; flex-shrink:0;}
.nav-item .cnt{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-dim2);}

.sidebar-foot{
  padding:12px 18px; border-top:1px solid var(--border);
  font-size:10.5px; color:var(--text-dim2); font-family:var(--mono);
}

#main{flex:1; min-width:0; padding:26px 34px 60px 34px; max-width:1180px;}

#nav-toggle{
  display:none; position:fixed; top:14px; left:14px; z-index:60;
  width:38px; height:38px; border-radius:9px; background:var(--panel2);
  border:1px solid var(--border2); color:var(--text); font-size:17px; cursor:pointer;
}
#nav-scrim{
  display:none; position:fixed; inset:0; background:rgba(6,8,11,0.55); z-index:45;
}
#nav-scrim.show{display:block;}
.brand{position:relative;}
#nav-close{display:none; position:absolute; top:12px; right:12px;}

@media (max-width:860px){
  #nav-toggle{display:flex; align-items:center; justify-content:center;}
  #nav-close{display:flex;}
  #sidebar{
    position:fixed; left:0; top:0; z-index:55; width:250px;
    transform:translateX(-104%); transition:transform .2s ease;
    box-shadow:2px 0 24px rgba(0,0,0,0.5);
  }
  #sidebar.open{transform:translateX(0);}
  #main{padding:64px 16px 50px 16px; max-width:100%;}
  h1{font-size:19px;}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}
  .stat-row{gap:8px;}
  .stat{min-width:0; flex:1 1 45%; padding:9px 12px;}
  .filter-row{gap:6px;}
  #drawer{width:100vw; max-width:100vw;}
  table.errtab{font-size:11.5px;}
  table.errtab th, table.errtab td{padding:7px 6px;}
  .diagram-frame svg{min-width:820px;}
  .page-desc{font-size:12.5px;}
  #hover-tip{display:none !important;}
}
@media (max-width:480px){
  .board-thumb{height:90px;}
  h1{font-size:17px;}
}
section.view{display:none;}
section.view.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.page-head{margin-bottom:20px;}
.page-eyebrow{font-family:var(--mono); font-size:11px; color:var(--data); letter-spacing:0.06em;}
h1{font-size:22px; margin:4px 0 6px 0; letter-spacing:-0.01em;}
.page-desc{color:var(--text-dim); font-size:13.5px; max-width:720px;}

h2.sec{font-size:15px; margin:30px 0 12px 0; color:var(--text); display:flex; align-items:center; gap:8px;}
h2.sec .bar{width:3px; height:15px; border-radius:2px; background:var(--data);}

.card{
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:16px 18px;
}
.grid{display:grid; gap:12px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}}

/* pills / tags */
.tag{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-size:10.5px; padding:2px 8px;
  border-radius:20px; border:1px solid var(--border2); color:var(--text-dim);
  white-space:nowrap;
}
.tag .d{width:6px;height:6px;border-radius:50%;}

/* buttons/inputs */
input[type=text]{
  background:var(--panel2); border:1px solid var(--border2); color:var(--text);
  padding:9px 12px; border-radius:8px; font-family:var(--sans); font-size:13px;
  outline:none; width:100%;
}
input[type=text]:focus{border-color:var(--data);}
input[type=text]::placeholder{color:var(--text-dim2);}
select{
  background:var(--panel2); border:1px solid var(--border2); color:var(--text);
  padding:9px 10px; border-radius:8px; font-family:var(--sans); font-size:12.5px; outline:none;
}
.filter-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.chip-btn{
  background:var(--panel2); border:1px solid var(--border2); color:var(--text-dim);
  padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer; user-select:none;
}
.chip-btn:hover{color:var(--text);}
.chip-btn.on{background:var(--panel3); color:var(--text); border-color:var(--data); box-shadow:0 0 0 1px var(--data) inset;}

/* board cards */
.board-card{
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; cursor:pointer; transition:border-color .15s;
}
.board-card:hover{border-color:var(--border2);}
.board-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.board-name{font-weight:600; font-size:13.5px;}
.board-pn{font-family:var(--mono); font-size:10.5px; color:var(--text-dim2); margin-top:2px;}
.board-fn{font-size:12.5px; color:var(--text-dim); margin-top:8px; line-height:1.45;}
.board-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

/* detail drawer */
#overlay{
  position:fixed; inset:0; background:rgba(6,8,11,0.6); backdrop-filter:blur(2px);
  display:none; z-index:50; align-items:flex-start; justify-content:flex-end;
}
#overlay.show{display:flex;}
#drawer{
  width:440px; max-width:92vw; height:100vh; background:var(--panel);
  border-left:1px solid var(--border2); overflow-y:auto; padding:22px 24px 40px 24px;
  animation:slidein .18s ease;
}
@keyframes slidein{from{transform:translateX(24px); opacity:0;} to{transform:none; opacity:1;}}
#drawer .close{
  float:right; cursor:pointer; color:var(--text-dim); font-size:20px; line-height:1;
  background:var(--panel2); border:1px solid var(--border2); width:28px;height:28px;border-radius:7px;
  display:flex; align-items:center; justify-content:center;
}
#drawer h3{font-size:17px; margin:2px 0 2px 0;}
#drawer .pn{font-family:var(--mono); color:var(--text-dim2); font-size:11.5px; margin-bottom:14px;}
#drawer .drawer-section{margin-top:16px;}
#drawer .drawer-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim2); margin-bottom:6px; font-weight:600;}
#drawer ul{margin:0; padding-left:18px;}
#drawer li{margin-bottom:4px; font-size:12.5px; color:var(--text-dim);}
#drawer .specline{font-family:var(--mono); font-size:12px; color:var(--text); background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:6px 10px; margin-bottom:6px;}
.ask-errors{margin-top:22px; background:linear-gradient(180deg, var(--panel3), var(--panel2)); border:1px solid var(--safety); border-radius:10px; padding:14px 16px;}
.ask-errors-q{font-size:13px; font-weight:600; margin-bottom:10px;}
.ask-errors-row{display:flex; gap:8px;}
.ask-yes{flex:1; background:var(--safety); color:#1a0f0d; border:none; font-weight:700; font-size:12.5px; padding:9px 10px; border-radius:7px; cursor:pointer;}
.ask-no{background:transparent; color:var(--text-dim); border:1px solid var(--border2); font-size:12.5px; padding:9px 12px; border-radius:7px; cursor:pointer;}

/* PM checklist */
.pm-period-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.pm-progress-wrap{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 18px; margin-bottom:20px;}
.pm-progress-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.pm-progress-label{font-size:12.5px; color:var(--text-dim); font-family:var(--mono);}
.pm-progress-bar{height:8px; background:var(--panel2); border-radius:5px; overflow:hidden;}
.pm-progress-fill{height:100%; background:linear-gradient(90deg, var(--control), var(--data)); border-radius:5px; transition:width .25s ease;}
.pm-reset-btn{font-size:11px; color:var(--text-dim2); background:none; border:1px solid var(--border2); border-radius:6px; padding:4px 10px; cursor:pointer;}
.pm-reset-btn:hover{color:var(--safety); border-color:var(--safety);}

.pm-section{margin-bottom:10px; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--panel);}
.pm-section-head{display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; user-select:none;}
.pm-section-head:hover{background:var(--panel2);}
.pm-section-num{font-family:var(--mono); font-size:11px; color:var(--text-dim2); background:var(--panel2); border-radius:5px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.pm-section-title{font-weight:600; font-size:13.5px; flex:1;}
.pm-section-count{font-family:var(--mono); font-size:11px; color:var(--text-dim2);}
.pm-section-caret{color:var(--text-dim2); transition:transform .15s; font-size:11px;}
.pm-section.open .pm-section-caret{transform:rotate(90deg);}
.pm-section-body{display:none; border-top:1px solid var(--border);}
.pm-section.open .pm-section-body{display:block;}

.pm-item{border-bottom:1px solid var(--border);}
.pm-item:last-child{border-bottom:none;}
.pm-item-row{display:flex; align-items:flex-start; gap:10px; padding:10px 16px;}
.pm-checkbox{width:17px; height:17px; margin-top:2px; flex-shrink:0; accent-color:var(--control); cursor:pointer;}
.pm-item-main{flex:1; cursor:pointer; min-width:0;}
.pm-item-text{font-size:12.5px; line-height:1.45;}
.pm-item.done .pm-item-text{color:var(--text-dim2); text-decoration:line-through;}
.pm-item-meta{display:flex; gap:6px; align-items:center; margin-top:4px; flex-wrap:wrap;}
.pm-freq-badge{font-family:var(--mono); font-size:9px; padding:1px 6px; border-radius:4px; background:var(--power-dim); color:var(--power); white-space:nowrap;}
.pm-freq-badge.sa{background:var(--xray-dim); color:var(--xray);}
.pm-caret-mini{color:var(--data); font-size:10.5px; cursor:pointer;}
.pm-item-detail{display:none; padding:0 16px 14px 43px;}
.pm-item.expanded .pm-item-detail{display:block;}
.pm-how-box{background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
.pm-how-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim2); font-weight:600; margin-bottom:6px;}
.pm-how-box ul{margin:0; padding-left:16px;}
.pm-how-box li{font-size:12px; color:var(--text-dim); margin-bottom:4px; line-height:1.4;}
.pm-goto-btn{margin-top:8px; display:inline-block; font-size:11.5px; background:var(--panel3); border:1px solid var(--data); color:var(--data); padding:5px 11px; border-radius:6px; cursor:pointer;}
.pm-no-detail{font-size:11.5px; color:var(--text-dim2); font-style:italic;}

#hover-tip{
  position:fixed; z-index:80; pointer-events:none; display:none;
  background:var(--panel3); border:1px solid var(--border2); border-radius:9px;
  padding:6px; box-shadow:0 8px 24px rgba(0,0,0,0.5); max-width:220px;
}
#hover-tip img{display:block; width:208px; border-radius:6px;}
#hover-tip .cap{font-size:10.5px; color:var(--text-dim); text-align:center; padding-top:5px;}

.board-thumb{width:100%; height:110px; object-fit:cover; border-radius:8px; margin-bottom:10px; border:1px solid var(--border);}

/* error table */
table.errtab{width:100%; border-collapse:collapse; font-size:12.5px;}
table.errtab th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text-dim2); padding:8px 10px; border-bottom:1px solid var(--border2);
  position:sticky; top:0; background:var(--panel); z-index:2;
}
table.errtab td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
table.errtab tr:hover td{background:var(--panel2);}
.err-code{font-family:var(--mono); font-weight:700; white-space:nowrap;}
.err-msg{font-weight:600;}
.err-cause{color:var(--text-dim);}
.sys-tag{font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:5px; white-space:nowrap; display:inline-block;}
.tablewrap{max-height:70vh; overflow:auto; border:1px solid var(--border); border-radius:10px;}
.err-count{color:var(--text-dim2); font-size:12px; margin-bottom:10px; font-family:var(--mono);}

/* svg diagram frame */
.diagram-frame{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:8px; overflow-x:auto;
}
.diagram-frame svg{display:block; margin:0 auto; min-width:640px;}
.diagram-caption{font-size:11.5px; color:var(--text-dim2); padding:10px 6px 2px 6px;}
.legend{display:flex; gap:14px; flex-wrap:wrap; padding:10px 6px 0 6px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim);}
.legend-swatch{width:14px; height:3px; border-radius:2px;}

.callout{
  border-left:3px solid var(--power); background:var(--panel2); border-radius:0 8px 8px 0;
  padding:10px 14px; font-size:12.5px; color:var(--text-dim); margin:14px 0;
}
.callout.safety{border-color:var(--safety);}
.callout strong{color:var(--text); font-weight:600;}

.stat-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}
.stat{
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:10px 16px; min-width:110px;
}
.stat .n{font-family:var(--mono); font-size:18px; font-weight:700;}
.stat .l{font-size:10.5px; color:var(--text-dim2); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

.clickzone{cursor:pointer;}
.clickzone:hover rect, .clickzone:hover polygon{filter:brightness(1.25);}
.clickzone text{pointer-events:none;}

::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2); border-radius:6px;}
</style>
</head>
<body>
<div id="app">
  <div id="nav-scrim"></div>
  <button id="nav-toggle" aria-label="Open menu">☰</button>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-chip">9800</div>
        <div>
          <div class="brand-title">CTX 9800 DSi</div>
          <div class="brand-sub">FIELD REFERENCE · Rev 3</div>
        </div>
      </div>
      <div class="close" id="nav-close" onclick="document.getElementById('sidebar').classList.remove('open');document.getElementById('nav-scrim').classList.remove('show');">×</div>
    </div>
    <nav id="navlist"></nav>
    <div class="sidebar-foot">P/N 963079-1 · Morpho Detection<br>Source: Service Manual Rev 3</div>
  </aside>

  <main id="main"></main>
</div>

<div id="overlay"><div id="drawer"></div></div>
<div id="hover-tip"></div>

<script>
/* =========================================================================
   DATA — extracted from CTX 9800 DSi Service Manual, P/N 963079-1 Rev.3

/* =========================================================================
   SVG DIAGRAM HELPERS
   ========================================================================= */
function nbox(x,y,w,h,color,lines,boardId){
  const cx = x+w/2, cy = y+h/2;
  const click = boardId ? ` class="clickzone" data-board="${boardId}" onclick="goBoard('${boardId}')"` : '';
  const startDy = -((lines.length-1)*7);
  const tspans = lines.map((t,i)=>`<tspan x="${cx}" dy="${i===0?startDy:14}" style="${i===0?'font-weight:700;font-size:11.5px;fill:var(--text);':'font-size:9.5px;fill:var(--text-dim);'}">${t}</tspan>`).join('');
  return `<g${click}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" style="fill:var(--panel3);stroke:var(--${color});stroke-width:1.3;"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" font-family="var(--sans)">${tspans}</text>
  </g>`;
}
function nchip(x,y,w,h,color,label,boardId){
  const cx=x+w/2, cy=y+h/2+4;
  const click = boardId ? ` class="clickzone" data-board="${boardId}" onclick="goBoard('${boardId}')"` : '';
  return `<g${click}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" style="fill:var(--panel2);stroke:var(--${color});stroke-width:1;opacity:${boardId?1:0.55};"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" font-family="var(--sans)" font-size="10.5" style="fill:${boardId?'var(--text)':'var(--text-dim)'};">${label}</text>
  </g>`;
}
function eline(x1,y1,x2,y2,color,dashed){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--${color});stroke-width:1.5;${dashed?'stroke-dasharray:5,4;':''}" marker-end="url(#arrow-${color})"/>`;
}
function eelbow(pts,color,dashed){
  return `<polyline points="${pts}" style="fill:none;stroke:var(--${color});stroke-width:1.5;${dashed?'stroke-dasharray:5,4;':''}" marker-end="url(#arrow-${color})"/>`;
}
function elabel(x,y,text,color,anchor){
  return `<text x="${x}" y="${y}" text-anchor="${anchor||'middle'}" font-family="var(--mono)" font-size="9.5" style="fill:var(--${color});">${text}</text>`;
}
function frame(x,y,w,h,color){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" style="fill:none;stroke:var(--${color});stroke-width:1.2;opacity:0.55;"/>`;
}
function markerDefs(){
  const colors=['power','data','control','safety','xray'];
  return `<svg width="0" height="0" style="position:absolute"><defs>${colors.map(c=>
    `<marker id="arrow-${c}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--${c})"/></marker>`
  ).join('')}</defs></svg>`;
}
function legend(items){
  return `<div class="legend">${items.map(([label,color,dashed])=>
    `<div class="legend-item"><span class="legend-swatch" style="background:var(--${color});${dashed?'background-image:repeating-linear-gradient(90deg,var(--'+color+') 0 4px, transparent 4px 7px);background-color:transparent;':''}"></span>${label}</div>`
  ).join('')}</div>`;
}

function buildNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = NAV.map(g=>`
    <div class="nav-group">
      <div class="nav-label">${g.group}</div>
      ${g.items.map(it=>`
        <div class="nav-item" data-view="${it.id}" onclick="selectView('${it.id}')">
          <span class="nav-dot" style="background:var(--${it.color})"></span>
          <span>${it.label}</span>
          ${it.cnt?`<span class="cnt">${it.cnt}</span>`:''}
        </div>`).join('')}
    </div>`).join('');
}

function selectView(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('active', s.id==='view-'+id));
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0,0);
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('nav-scrim');
  if(sidebar) sidebar.classList.remove('open');
  if(scrim) scrim.classList.remove('show');
}

function goBoard(id){
  selectView('boards');
  renderBoards();
  requestAnimationFrame(()=>openDrawer(id));
}
function goErrors(sysTag){
  selectView('errors');
  window.__errFilter = sysTag || 'ALL';
  renderErrors();
}

function svgFullFlow(){
  const cx=850;

  s += nbox(720,20,260,56,'power',['FACILITY MAINS','208–480 VAC, site-dependent']);
  s += eline(cx,76,cx,100,'power');
  s += nbox(690,100,320,56,'power',['SURGE SUPPRESSOR + EMI FILTER']);
  s += eline(cx,156,cx,180,'power');
  s += nbox(720,180,260,56,'power',['AUTOTRANSFORMER'],'autotransformer');
  s += eline(cx,236,cx,260,'power');
  s += nbox(690,260,320,56,'power',['UPS — on-line + bypass'],'ups');
  s += eline(cx,316,cx,340,'power');
  s += nbox(605,340,235,60,'power',['PDP — AC/DC POWER SECTION'],'pdp-power');
  s += nbox(860,340,235,60,'safety',['PDP — CONTROL SECTION'],'pdp-control');
  s += eline(840,370,860,370,'text-dim2');

  // bus from PDP-power to 5 trunks
  s += eline(722,400,722,420,'power');
  s += eline(200,420,1500,420,'power');
  [200,460,720,980,1500].forEach(x=>{ s += eline(x,420,x,440,'power'); });
  // PDP-control to safety trunk
  s += eelbow('977,400 977,430 1240,430 1240,440','safety',true);

  const trunks = [
    {x:90, color:'control', label:['MOTION CONTROL PANEL'],
     leaves:[ [['Servo Drive 1','Gantry'],'servo1'], [['Servo Drive 2','Conveyor'],'servo2'], [['Motion I/O Board'],'motion-io'] ]},
    {x:350, color:'power', label:['GANTRY (slip ring)'],
     leaves:[ [['PDB-PSM → GPS','+24V/+48V'],'gps'], [['PDB-DAS 1 / 2','±3.3V'],'pdb-das1'], [['GBP 1/2 + DCB','→ 21 DMAs'],'dcb'] ]},
    {x:610, color:'xray', label:['X-RAY HVPS']},
    {x:870, color:'power', label:['A/C UNIT']},
    {x:1130, color:'safety', label:['SAFETY I/O (ADAM)']},
    {x:1390, color:'data', label:['COMPUTERS']},
  ];
  trunks[2].leaves = [ [['HVIC'],'hvic'], [['HVPS'],'hvps'] ];
  trunks[3].leaves = [ [['A/C Controller'],'ac-unit'] ];
  trunks[4].leaves = [ [['ADAM E1 / E2 / E3'],'adam'], [['PDP Relays','K6/K7/K15/K17'],'pdp-control'] ];
  trunks[5].leaves = [ [['Host Computer'],'host-computer'], [['Recon Computer'],'recon-computer'] ];

  trunks.forEach(tr=>{
    s += nbox(tr.x,440,220,56,tr.color,tr.label);

    tr.leaves.forEach(([lines,id])=>{
      s += eline(tr.x+110, prevBottom, tr.x+110, y, tr.color);
      s += nbox(tr.x,y,220,50,tr.color,lines,id);
      prevBottom = y+50;
      y += 58;
    });
  });

  s += `<text x="${cx}" y="850" text-anchor="middle" font-size="11" style="fill:var(--text-dim2);">Detail on any branch: DAS / Imaging · Motion &amp; Safety Loop · X-Ray / HVPS pages</text>`;
  s += `</svg>`;
  return s;
}

  const state = pmLoadState();
  const done = !!state[it.id];
  const expanded = window.__pmExpanded.has(it.id);
  const freqBadge = it.freq==='qsa' ? `<span class="pm-freq-badge">Q/S/A only</span>` : it.freq==='sa' ? `<span class="pm-freq-badge sa">S/A only</span>` : '';
  const board = it.link ? BOARDS.find(b=>b.id===it.link) : null;
  return `
  <div class="pm-item${done?' done':''}${expanded?' expanded':''}" id="pmrow-${it.id}">
    <div class="pm-item-row">
      <input type="checkbox" class="pm-checkbox" ${done?'checked':''} onclick="togglePMCheck('${it.id}', event)">
      <div class="pm-item-main" onclick="togglePMDetail('${it.id}')">
        <div class="pm-item-text">${it.id.replace(/[0-9]+/,'').toUpperCase()}. ${it.text}</div>
        <div class="pm-item-meta">${freqBadge}${(it.how||board)?'<span class="pm-caret-mini">▾ how to do it</span>':''}</div>
      </div>
    </div>
    ${(it.how||board)?`<div class="pm-item-detail">
      <div class="pm-how-box">
        ${it.how?`<div class="pm-how-label">How to do it</div><ul>${it.how.map(h=>`<li>${h}</li>`).join('')}</ul>`:`<div class="pm-no-detail">No extra detail beyond the checklist step itself.</div>`}
        ${board?`<button class="pm-goto-btn" onclick="event.stopPropagation();goBoard('${board.id}')">→ View ${board.name}</button>`:''}
      </div>
    </div>`:''}
  </div>`;
}

function renderPM(){
  const wrap = document.getElementById('pm-sections');
  if(!wrap) return;
  const period = window.__pmPeriod;
  wrap.innerHTML = PMSECTIONS.map(sec=>{
    const visItems = sec.items.filter(it=>pmItemVisible(it.freq, period));
    if(visItems.length===0) return '';
    const open = window.__pmOpenSections.has(sec.n);
    return `<div class="pm-section${open?' open':''}" id="pmsec-${sec.n}">
      <div class="pm-section-head" onclick="togglePMSection(${sec.n})">
        <span class="pm-section-num">${sec.n}</span>
        <span class="pm-section-title">${sec.title}</span>
        <span class="pm-section-count">${visItems.length} step${visItems.length===1?'':'s'}</span>
        <span class="pm-section-caret">▶</span>
      </div>
      <div class="pm-section-body">${visItems.map(pmItemRow).join('')}</div>
    </div>`;
  }).join('');

  const postBody = document.getElementById('pm-post-body');
  if(postBody){
    postBody.innerHTML = PM_POSTITEMS.map(it=>pmItemRow(it)).join('');
  }

  pmUpdateProgress();
}

function pmUpdateProgress(){
  const period = window.__pmPeriod;
  const state = pmLoadState();
  let total=0, done=0;
  PMSECTIONS.forEach(sec=>sec.items.filter(it=>pmItemVisible(it.freq,period)).forEach(it=>{ total++; if(state[it.id]) done++; }));
  PM_POSTITEMS.forEach(it=>{ total++; if(state[it.id]) done++; });
  const label = document.getElementById('pm-progress-label');
  const fill = document.getElementById('pm-progress-fill');
  if(label) label.textContent = `${done} / ${total} complete`;
  if(fill) fill.style.width = total? `${Math.round(done/total*100)}%` : '0%';
}

function togglePMCheck(id, evt){
  if(evt) evt.stopPropagation();
  const state = pmLoadState();
  state[id] = !state[id];
  pmSaveState(state);
  const row = document.getElementById('pmrow-'+id);
  if(row) row.classList.toggle('done', !!state[id]);
  pmUpdateProgress();
}
function togglePMDetail(id){
  if(window.__pmExpanded.has(id)) window.__pmExpanded.delete(id);
  else window.__pmExpanded.add(id);
  const row = document.getElementById('pmrow-'+id);
  if(row) row.classList.toggle('expanded');
}
function togglePMSection(n){
  if(window.__pmOpenSections.has(n)) window.__pmOpenSections.delete(n);
  else window.__pmOpenSections.add(n);
  const sec = document.getElementById('pmsec-'+n);
  if(sec) sec.classList.toggle('open');
}
function setPMPeriod(period){
  window.__pmPeriod = period;
  document.querySelectorAll('#view-pm .chip-btn').forEach(b=>b.classList.toggle('on', b.dataset.period===period));
  renderPM();
}
function resetPMProgress(){
  pmSaveState({});
  renderPM();
}

function viewGlossary(){
  return `
  <div class="page-head">
    <div class="page-eyebrow">SYSTEM</div>
    <h1>Glossary & abbreviations</h1>
    <p class="page-desc">Every abbreviation used across this reference, plus the manual's own terms. Tap a linked term to jump straight to its board.</p>
  </div>
  <div class="filter-row">
    <input type="text" id="gloss-search" placeholder="Search abbreviations…" oninput="renderGlossary()" style="max-width:280px;">
  </div>
  <div class="err-count" id="gloss-count"></div>
  <div class="tablewrap" style="max-height:none;">
    <table class="errtab" id="gloss-table">
      <thead><tr><th style="width:130px;">Term</th><th>Meaning</th></tr></thead>
      <tbody id="gloss-body"></tbody>
    </table>
  </div>`;
}
function renderGlossary(){
  const body = document.getElementById('gloss-body');
  if(!body) return;
  const q = (document.getElementById('gloss-search')?.value||'').toLowerCase();
  const list = GLOSSARY.filter(g => !q || (g.t+' '+g.d).toLowerCase().includes(q));
  const cnt = document.getElementById('gloss-count');
  if(cnt) cnt.textContent = `${list.length} of ${GLOSSARY.length} terms`;
  body.innerHTML = list.map(g=>`
    <tr>
      <td class="err-code">${g.link?`<a href="javascript:void(0)" onclick="goBoard('${g.link}')" style="color:var(--data);text-decoration:none;">${g.t} ↗</a>`:g.t}</td>
      <td class="err-cause">${g.d}</td>
    </tr>`).join('') || `<tr><td colspan="2" style="color:var(--text-dim2);padding:20px;">No matches.</td></tr>`;
}

function viewBoards(){
  const cats = Object.keys(CATLABEL);
  return `
  <div class="page-head">
    <div class="page-eyebrow">REFERENCE</div>
    <h1>Board library</h1>
    <p class="page-desc">Every board and major assembly referenced in the service manual. Tap a card for connectors, rails, LEDs, and location.</p>
  </div>
  <div class="filter-row">
    <input type="text" id="board-search" placeholder="Search boards, part numbers…" oninput="renderBoards()" style="max-width:280px;">
    <div class="chip-btn on" data-cat="ALL" onclick="setBoardCat('ALL')">All (${BOARDS.length})</div>
    ${cats.map(c=>`<div class="chip-btn" data-cat="${c}" onclick="setBoardCat('${c}')">${CATLABEL[c]}</div>`).join('')}
  </div>
  <div class="grid cols-3" id="board-grid"></div>`;
}
window.__boardCat = 'ALL';
function setBoardCat(c){
  window.__boardCat = c;
  document.querySelectorAll('#view-boards .chip-btn').forEach(b=>b.classList.toggle('on', b.dataset.cat===c));
  renderBoards();
}
function renderBoards(){
  const grid = document.getElementById('board-grid');
  if(!grid) return;
  const q = (document.getElementById('board-search')?.value||'').toLowerCase();
  const cat = window.__boardCat||'ALL';
  const list = BOARDS.filter(b=>{
    if(cat!=='ALL' && b.cat!==cat) return false;
    if(!q) return true;
    return (b.name+' '+b.pn+' '+b.fn).toLowerCase().includes(q);
  });
  grid.innerHTML = list.map(b=>{
    const thumb = b.photo && IMAGES[b.photo] ? `<img class="board-thumb" src="data:image/jpeg;base64,${IMAGES[b.photo]}" alt="${b.name}">` : '';
    return `
    <div class="board-card" onclick="openDrawer('${b.id}')">
      ${thumb}
      <div class="board-top">
        <div>
          <div class="board-name">${b.name}</div>
          <div class="board-pn">${b.pn}</div>
        </div>
        <span class="tag"><span class="d" style="background:var(--${CATCOLOR[b.cat]})"></span>${CATLABEL[b.cat]}</span>
      </div>
      <div class="board-fn">${b.fn}</div>
    </div>`;
  }).join('') || `<div style="color:var(--text-dim2);padding:20px;">No boards match.</div>`;
}

/* =========================================================================
   DRAWER (board detail)
   ========================================================================= */
function openDrawer(id){
  const b = BOARDS.find(x=>x.id===id);
  if(!b) return;
  const photoHtml = b.photo && IMAGES[b.photo] ? `<img src="data:image/jpeg;base64,${IMAGES[b.photo]}" alt="${b.name}" style="width:100%;border-radius:9px;border:1px solid var(--border2);margin-bottom:14px;display:block;">` : '';
  document.getElementById('drawer').innerHTML = `
    <div class="close" onclick="closeDrawer()">×</div>
    <span class="tag"><span class="d" style="background:var(--${CATCOLOR[b.cat]})"></span>${CATLABEL[b.cat]}</span>
    <h3>${b.name}</h3>
    <div class="pn">${b.pn}${b.loc?' · '+b.loc:''}</div>
    ${photoHtml}
    <div style="font-size:13px;color:var(--text-dim);">${b.fn}</div>
    ${b.elec&&b.elec.length?`<div class="drawer-section"><div class="drawer-label">⚡ Electrical I/O</div>${b.elec.map(s=>`<div class="specline">${s}</div>`).join('')}</div>`:''}
    ${b.data&&b.data.length?`<div class="drawer-section"><div class="drawer-label">📡 Data I/O</div>${b.data.map(s=>`<div class="specline" style="color:var(--data);border-color:var(--data-dim);">${s}</div>`).join('')}</div>`:''}
    ${b.leds&&b.leds.length?`<div class="drawer-section"><div class="drawer-label">Status LEDs</div><ul>${b.leds.map(l=>`<li>${l}</li>`).join('')}</ul></div>`:''}
    ${b.note?`<div class="drawer-section"><div class="drawer-label">🔧 Maintenance note</div><div class="specline" style="color:var(--mechc);border-color:var(--mechc-dim);white-space:normal;">${b.note}</div></div>`:''}
    <div class="ask-errors">
      <div class="ask-errors-q">🔎 Want to see known errors &amp; faults for this item?</div>
      <div class="ask-errors-row">
        <button class="ask-yes" onclick="goErrorsFromDrawer('${b.id}')">Yes, search →</button>
        <button class="ask-no" onclick="closeDrawer()">No, close</button>
      </div>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function closeDrawer(){ document.getElementById('overlay').classList.remove('show'); }
function goErrorsFromDrawer(boardId){
  closeDrawer();
  const b = BOARDS.find(x=>x.id===boardId);
  const name = b ? b.name : '';
  let sys='ALL', term='';
  if(name.includes('DIFB')){ sys='DIFB'; }
  else if(name.includes('Lenze')||boardId==='servo1'||boardId==='servo2'){ sys='LENZE'; }
  else if(name.includes('HVPS')||name.includes('HVIC')){ sys='HVPS'; }
  else if(name.includes('Air Innovations')){ sys='A/C'; }
  else if(boardId==='pdp-control'||boardId==='adam'||boardId==='bhs-interface'){ sys='SAFETY'; }
  else if(boardId==='dma'||boardId==='ad-board'){ sys='DAS'; term='bad'; }
  window.__errFilter = sys;
  const box = document.getElementById('err-search');
  if(box){ box.value = term; }
  selectView('errors');
  renderErrors();
  const cnt = document.getElementById('err-count');
  if(cnt && typeof cnt.scrollIntoView === 'function') cnt.scrollIntoView({block:'start'});
}

/* =========================================================================
   ERRORS & FAULTS
   ========================================================================= */
const SYSCOLOR = {DIFB:'data', DAS:'data', LENZE:'control', HVPS:'xray', 'A/C':'power', SAFETY:'safety'};
function viewErrors(){
  const systems = [...new Set(ERRORS.map(e=>e.sys))];
  return `
  <div class="page-head">
    <div class="page-eyebrow">REFERENCE</div>
    <h1>Errors & faults</h1>
    <p class="page-desc">Every fault, error, and indicator-light code found in the manual, in one searchable table. Search by code, keyword, or symptom.</p>
  </div>
  <div class="filter-row">
    <input type="text" id="err-search" placeholder="Search code, message, or cause…" oninput="renderErrors()" style="max-width:320px;">
    <div class="chip-btn on" data-sys="ALL" onclick="setErrSys('ALL')">All (${ERRORS.length})</div>
    ${systems.map(s=>`<div class="chip-btn" data-sys="${s}" onclick="setErrSys('${s}')">${s} (${ERRORS.filter(e=>e.sys===s).length})</div>`).join('')}
  </div>
  <div class="err-count" id="err-count"></div>
  <div class="tablewrap">
    <table class="errtab">
      <thead><tr><th style="width:80px;">System</th><th style="width:130px;">Code</th><th style="width:230px;">Message</th><th>Cause & action</th></tr></thead>
      <tbody id="err-body"></tbody>
    </table>
  </div>`;
}
function setErrSys(s){
  window.__errFilter = s;
  renderErrors();
}
function renderErrors(){
  const body = document.getElementById('err-body');
  if(!body) return;
  const q = (document.getElementById('err-search')?.value||'').toLowerCase();
  const sys = window.__errFilter||'ALL';
  document.querySelectorAll('#view-errors .chip-btn').forEach(b=>b.classList.toggle('on', (b.dataset.sys||'ALL')===sys));
  const list = ERRORS.filter(e=>{
    if(sys!=='ALL' && e.sys!==sys) return false;
    if(!q) return true;
    return (e.code+' '+e.msg+' '+e.cause+' '+(e.note||'')).toLowerCase().includes(q);
  });
  const cnt = document.getElementById('err-count');
  if(cnt) cnt.textContent = `${list.length} of ${ERRORS.length} entries`;
  body.innerHTML = list.map(e=>`
    <tr>
      <td><span class="sys-tag" style="background:var(--${SYSCOLOR[e.sys]||'border'}-dim);color:var(--${SYSCOLOR[e.sys]||'text-dim2'});">${e.sys}</span></td>
      <td class="err-code">${e.code}</td>
      <td class="err-msg">${e.msg}</td>
      <td class="err-cause">${e.cause}${e.note?` <span style="color:var(--text-dim2);">— ${e.note}</span>`:''}</td>
    </tr>`).join('') || `<tr><td colspan="4" style="color:var(--text-dim2);padding:20px;">No matches.</td></tr>`;
}

/* =========================================================================
   APP INIT
   ========================================================================= */
const VIEWFN = {overview:viewOverview, glossary:viewGlossary, fullflow:viewFullFlow, power:viewPower, das:viewDAS, motion:viewMotion, xray:viewXray, dataflow:viewDataFlow, mechanical:viewMechanical, maintenance:viewMaintenance, pm:viewPM, boards:viewBoards, errors:viewErrors};
function renderApp(){
  const main = document.getElementById('main');
  main.innerHTML = Object.keys(VIEWFN).map((id,i)=>`<section id="view-${id}" class="view${i===0?' active':''}">${VIEWFN[id]()}</section>`).join('');
  renderBoards();
  renderErrors();
  renderGlossary();
  renderPM();
}
document.addEventListener('DOMContentLoaded', function(){
  document.body.insertAdjacentHTML('afterbegin', markerDefs());
  buildNav();
  renderApp();
  selectView('overview');
  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id==='overlay') closeDrawer(); });
  initHoverTips();
  initMobileNav();
});

/* =========================================================================
   HOVER IMAGE TOOLTIPS (diagram nodes, desktop only — touch users tap through)
   ========================================================================= */
function initHoverTips(){
  const tip = document.getElementById('hover-tip');
  document.addEventListener('mouseover', function(e){
    const el = e.target.closest ? e.target.closest('.clickzone') : null;
    if(!el || !el.dataset.board) return;
    const b = BOARDS.find(x=>x.id===el.dataset.board);
    if(!b || !b.photo || !IMAGES[b.photo]) return;
    tip.innerHTML = `<img src="data:image/jpeg;base64,${IMAGES[b.photo]}" alt=""><div class="cap">${b.name}</div>`;
    tip.style.display = 'block';
  });
  document.addEventListener('mousemove', function(e){
    if(tip.style.display !== 'block') return;
    let x = e.clientX + 18, y = e.clientY + 18;
    if(x + 230 > window.innerWidth) x = e.clientX - 238;
    if(y + 200 > window.innerHeight) y = e.clientY - 200;
    tip.style.left = x+'px'; tip.style.top = y+'px';
  });
  document.addEventListener('mouseout', function(e){
    const el = e.target.closest ? e.target.closest('.clickzone') : null;
    if(el) tip.style.display = 'none';
  });
}

/* =========================================================================
   MOBILE NAV (off-canvas sidebar)
   ========================================================================= */
function initMobileNav(){
  const toggle = document.getElementById('nav-toggle');
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('nav-scrim');
  if(!toggle) return;
  toggle.addEventListener('click', function(){ sidebar.classList.add('open'); scrim.classList.add('show'); });
  scrim.addEventListener('click', function(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); });
}
</script>
